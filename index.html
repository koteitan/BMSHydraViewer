<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BMS Upper-branch ignoring Hydra Viewer</title>
  <link rel="stylesheet" href="style.css">
  <script src="./script.js"></script>
</head>
<body>
  <div class="menu" id="menu">
    <button type="button" class="menu-button" id="menu-button" aria-label="menu" aria-expanded="false" onclick="javascript:toggleMenu();">&#9776;</button>
    <div class="menu-panel" id="menu-panel">
      <label class="menu-item">
        <input type="checkbox" id="dark-check" onchange="javascript:handledarkcheck();">
        <span>Dark mode</span>
      </label>
    </div>
  </div>

  <h1>hydraviewer</h1>

  <div class="container">
    <form name="form">
      <div class="editor">
        <textarea id="input" class="input-textarea" contentEditable>(0,0,0)(1,1,1)(2,1,0)(1,1,1)
(0,0,0)(1,1,1)(2,2,1)(3,1,0)(4,2,1)(5,3,1)(6,2,0)(5,2,1)(6,2,1)</textarea>
        <button type="button" class="expand-button" title="insert X[1], X[2], ... under the line of the caret" onclick="javascript:handleexpand();">expand</button>
      </div>
    </form>
  </div>

  <div class="visualization">
    <canvas id="output" width="640" height="960" style="display:none"></canvas>
    <img id="outimg" style="border-style:none;border-width:1px">
  </div>

  <address>
    BMS Upper-branch ignoring Hydra Viewer v1.0.4<br>
    Programmed by <a href="https://twitter.com/koteitan">koteitan</a><br>
    Source code is on <a href="https://github.com/koteitan/BMSHydraViewer">GitHub</a>
  </address>
</body>
</html>
